# grafana/loki chart, single-binary mode with filesystem storage — sized for
# the single-node QA cluster. Retention 2 days (matches Prometheus).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 48h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
  # No self-monitoring / test pods: they need extra CRDs and add nothing here.
  podAnnotations: {}

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Zero out every microservices-mode component the chart would otherwise create.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
  lokiCanary: { enabled: false }
