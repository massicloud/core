# Domain configuration
domain:
  base: massicloud.work        # apex domain (test env)
  # Subdomains inherit from base
  # api.<base>, app.<base>, docs.<base>, <base>

# Container images (bump when you build new versions)
images:
  api:
    repository: ghcr.io/mikaminou/massicloud-api
    tag: "0.2.2"
    pullPolicy: IfNotPresent
  portal:
    repository: ghcr.io/mikaminou/massicloud-portal
    tag: "0.2.2"
  landing:
    repository: ghcr.io/mikaminou/massicloud-landing
    tag: "0.2.1"
  docs:
    repository: ghcr.io/mikaminou/massicloud-docs
    tag: "0.2.1"
  # Not deployed by this chart — mysql-rest is provisioned per-tenant by the
  # Go API itself (see internal/k8s/mysql_rest.go). This just tells the API
  # which image to use when it creates those Deployments.
  mysqlRest:
    repository: ghcr.io/mikaminou/massicloud-mysql-rest
    tag: "0.1.3"

# Backing-service images used when the API provisions tenant workloads on
# k8s (internal/k8s/{postgres,mysql,postgrest,mysql_rest}.go). Separate from
# `images` above, which are this chart's own platform services.
backingImages:
  postgres: postgres:16-alpine
  mysql: mysql:8.4
  redis: redis:7-alpine
  postgrest: postgrest/postgrest:v12.2.3

# Platform Postgres
platformPostgres:
  password: "Fzvx7H8GNb7wgUril1swnUQqeH+BA1g/oPAS+AIYTSM="
  storage: 10Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

# MinIO for object storage
minio:
  rootUser: massicloud
  rootPassword: "LEYeVE8c2V+sR0ipWlYDEpeuKzCnLbgGXS/ohXxdHTs="
  storage: 20Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

# API config
api:
  jwtSecret: "88d4f4c390b8757ff9cc367f66a6205c38b5c64e8922ddd1f5717debb249258d"
  registerSecret: "66c96d502cda8fb379bf463f5d747655f851651ce10bc309a40d2e75fcbe2945"
  tokenExpiryHours: 24
  replicas: 1
  resources:
    requests:
      memory: 384Mi
      cpu: 250m
    limits:
      memory: 1Gi

# Portal config
portal:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

# Landing config
landing:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi

# Docs (static)
docs:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi

# Ingress
ingress:
  className: traefik
  clusterIssuer: letsencrypt-prod

# Storage class (k3s default)
storageClass: local-path
