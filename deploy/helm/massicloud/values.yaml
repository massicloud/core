# Domain configuration
domain:
  base: massicloud.work        # apex domain (test env)
  # Subdomains inherit from base
  # api.<base>, app.<base>, docs.<base>, <base>

# Container images (bump when you build new versions)
images:
  api:
    repository: ghcr.io/massicloud/massicloud-api
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  portal:
    repository: ghcr.io/massicloud/massicloud-portal
    tag: "0.1.7"
    pullPolicy: IfNotPresent
  landing:
    repository: ghcr.io/massicloud/massicloud-landing
    tag: "0.1.2"
    pullPolicy: IfNotPresent
  docs:
    repository: ghcr.io/massicloud/massicloud-docs
    tag: "0.1.1"
    pullPolicy: IfNotPresent

# Backing-service images used when the API provisions tenant workloads on
# k8s (internal/k8s/{postgres,postgrest}.go). Separate from
# `images` above, which are this chart's own platform services.
backingImages:
  postgres: postgres:16-alpine
  redis: redis:7-alpine
  postgrest: postgrest/postgrest:v12.2.3
  mongo: percona/percona-server-mongodb:7.0

# Platform Postgres
platformPostgres:
  password: "Fzvx7H8GNb7wgUril1swnUQqeH+BA1g/oPAS+AIYTSM="
  storage: 10Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

# MinIO for object storage
minio:
  rootUser: massicloud
  rootPassword: "LEYeVE8c2V+sR0ipWlYDEpeuKzCnLbgGXS/ohXxdHTs="
  storage: 20Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

# API config
api:
  jwtSecret: "88d4f4c390b8757ff9cc367f66a6205c38b5c64e8922ddd1f5717debb249258d"
  registerSecret: "66c96d502cda8fb379bf463f5d747655f851651ce10bc309a40d2e75fcbe2945"
  tokenExpiryHours: 24
  replicas: 1
  resources:
    requests:
      memory: 384Mi
      cpu: 250m
    limits:
      memory: 1Gi

# Portal config
portal:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

# Landing config
landing:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi

# Docs (static)
docs:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi

# Ingress
ingress:
  className: traefik
  clusterIssuer: letsencrypt-prod

# Storage class (k3s default)
storageClass: local-path
