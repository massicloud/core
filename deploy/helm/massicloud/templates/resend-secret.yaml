# Placeholder so the API Deployment's secretKeyRef always resolves. The
# operator populates the real key manually (see CHANGELOG.md). The lookup
# keeps an already-populated key intact across `helm upgrade` instead of
# resetting it to "" (lookup returns nothing under `helm template`).
{{- $existing := lookup "v1" "Secret" .Release.Namespace "resend-creds" }}
apiVersion: v1
kind: Secret
metadata:
  name: resend-creds
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  api-key: {{ if and $existing $existing.data }}{{ index $existing.data "api-key" | default "" | quote }}{{ else }}""{{ end }}
