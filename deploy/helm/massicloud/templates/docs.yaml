apiVersion: apps/v1
kind: Deployment
metadata:
  name: massicloud-docs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.docs.replicas }}
  selector:
    matchLabels:
      app: massicloud-docs
  template:
    metadata:
      labels:
        app: massicloud-docs
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.images.docs.repository }}:{{ .Values.images.docs.tag }}"
        ports:
        - containerPort: 80
        resources:
{{ toYaml .Values.docs.resources | indent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: massicloud-docs
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: massicloud-docs
  ports:
  - port: 80
    targetPort: 80
