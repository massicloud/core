# Overlay for the Algeria production environment. Only overrides the values
# that differ from values.yaml — install with both files:
#
#   helm install massicloud ./deploy/helm/massicloud \
#     --namespace massicloud-system \
#     --values ./deploy/helm/massicloud/values.yaml \
#     --values ./deploy/helm/massicloud/values-production-algeria.yaml \
#     --values ./deploy/helm/massicloud/values-production-algeria-live.yaml
#
# This file is committed — it holds placeholders only. Real secrets belong in
# values-production-algeria-live.yaml (gitignored, same convention as
# values-live.yaml for the test environment). Never fill secrets in here.

domain:
  base: massicloud.dz

platformPostgres:
  password: "REPLACE_WITH_STRONG_PASSWORD"

minio:
  rootPassword: "REPLACE_WITH_STRONG_PASSWORD"

redis:
  password: "REPLACE_WITH_STRONG_PASSWORD"

api:
  jwtSecret: "REPLACE_WITH_STRONG_JWT_SECRET_32_CHARS"
  registerSecret: "REPLACE_WITH_STRONG_REGISTER_SECRET"
